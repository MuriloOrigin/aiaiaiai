<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Trabalho do Felipe - Card Game</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='trabalho_felipe.css') }}">
</head>
<body>
    <h1>Card Game do Felipe</h1>

    <div class="loja-boosters">
        <div class="card-loja comum-card selecionado" onclick="selecionarBooster(5.00, 1.0, 'Comum', this)">
            <h3>Pacote Comum</h3>
            <p>R$ 5,00</p>
            <button>Selecionar</button>
        </div>
        <div class="card-loja especial-card" onclick="selecionarBooster(15.00, 2.0, 'Especial', this)">
            <h3>Pacote Especial</h3>
            <p>R$ 15,00</p>
            <button>Selecionar</button>
        </div>
        <div class="card-loja lendario-card" onclick="selecionarBooster(40.00, 4.0, 'Lendário', this)">
            <h3>Pacote Lendário</h3>
            <p>R$ 40,00</p>
            <button>Selecionar</button>
        </div>
    </div>

    <div id="contador-lateral">
        <h3>Estatísticas</h3>
        <p>Reveladas: <span id="contador-abertas">0/7</span></p>
        <p>Especiais: <span id="contador-especiais">0</span></p>
        <p>Saldo: <span id="saldo-jogador">R$ 200.00</span></p>
        <button id="btn-album" onclick="abrirAlbum()">Abrir Álbum</button>
    </div>

    <div id="resultado">Selecione um booster e pressione Espaço para começar!</div>

    <div id="cartas"></div>

    <!-- Modal do Álbum -->
    <div id="modal-album" class="modal">
        <div class="modal-conteudo">
            <span class="fechar-modal" onclick="fecharAlbum()">&times;</span>
            <h2>Álbum de Cartas</h2>
            <button class="btn-vender-todas" onclick="venderTodasAsCartas()">Vender Tudo</button>
            <div id="grid-album"></div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='trabalho_felipe.js') }}"></script>
</body>
</html>
