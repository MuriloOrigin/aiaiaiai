<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booster do Senac</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='trabalho_felipe.css') }}?v=6">
</head>

<body>

    <!-- PAINEL LATERAL DIREITO (ESTATÍSTICAS E SALDO) -->
    <div id="contador-lateral">
        <h3>Estatísticas</h3>
        <p>Dinheiro: <span id="saldo-jogador" style="color: #00ff88;">R$ 100.00</span></p>
        <p>Cartas Abertas: <span id="contador-abertas">0/7</span></p>
        <p>Especiais: <span id="contador-especiais">0</span></p>
        
        <button onclick="abrirAlbum()" id="btn-album">VER ÁLBUM COMPLETO</button>
    </div>

    <!-- MODAL DO ÁLBUM DE COLEÇÃO -->
    <div id="modal-album" class="modal">
        <div class="modal-conteudo">
            <span class="fechar-modal" onclick="fecharAlbum()">&times;</span>
            <h2>Álbum de Coleção</h2>
            <p style="color: #aaa; font-size: 13px;">Coleciona todas as cartas (incluindo as raras versões Shiny!) e vende para ganhar dinheiro.</p>
            <div id="grid-album"></div>
        </div>
    </div>

    <h1>BOOSTER DO SENAC</h1>

    <p>Abra o seu pacote por <strong>R$ 5,00</strong> e descubra quais cartas conseguiu!</p>

    <div class="booster">
        <span>BOOSTER</span>
        <strong>7 CARTAS</strong>
        <span>?</span>
    </div>

    <button onclick="abrirBooster()" id="btn-abrir">ABRIR BOOSTER (R$ 5,00)</button>

    <div id="cartas"></div>

    <h2 id="resultado">Boa sorte!</h2>

    <script src="{{ url_for('static', filename='trabalho_felipe.js') }}"></script>

</body>

</html>
