<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booster do Senac</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='trabalho_felipe.css') }}?v=3">
</head>

<body>

    <!-- CONTADOR LATERAL DIREITO COM COLEÇÃO -->
    <div id="contador-lateral">
        <h3>Estatísticas</h3>
        <p>Cartas Abertas: <span id="contador-abertas">0/7</span></p>
        <p>Especiais: <span id="contador-especiais">0</span></p>
        
        <hr style="border: 0.5px solid #00e5ff; margin: 10px 0;">
        
        <h4 style="margin: 5px 0; font-size: 13px; color: #fffb02; text-align: center;">Minha Coleção</h4>
        <div id="lista-colecao">
            <span style="font-size: 11px; color: #888; display: block; text-align: center;">Nenhuma carta ainda</span>
        </div>
    </div>

    <h1>BOOSTER DO SENAC</h1>

    <p>Abra o seu pacote e descubra quais cartas conseguiu!</p>

    <div class="booster">
        <span>BOOSTER</span>
        <strong>7 CARTAS</strong>
        <span>?</span>
    </div>

    <button onclick="abrirBooster()">ABRIR BOOSTER</button>

    <div id="cartas"></div>

    <h2 id="resultado">Boa sorte!</h2>

    <script src="{{ url_for('static', filename='trabalho_felipe.js') }}"></script>

</body>

</html>
